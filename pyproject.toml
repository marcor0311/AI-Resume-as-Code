[project]
name = "career-as-code"
version = "0.1.0"
description = "Local career knowledge and evidence-based resume generation"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic[email]>=2.12.5,<3",
    "pydantic-extra-types>=2.11,<3",
    "pypdf>=6,<7",
    "rendercv==2.8",
    "rendercv-fonts==0.5.1",
    "ruamel.yaml>=0.19.1,<0.20",
    "typst==0.15.2",
]

[project.scripts]
career = "career.__main__:main"
career-eval = "evaluation.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["career", "evaluation"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
